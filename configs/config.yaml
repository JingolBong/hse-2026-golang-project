jira:
  program:
    jiraUrl: "https://issues.apache.org/jira"
    threadCount: 5
    issueInOneRequest: 100
    minTimeSleep: 100
    maxTimeSleep: 30000
    port: 8001
  writeDB:
    host: "postgres-master"
    port: 5432
    user: "pguser"
    password: "pgpwd"
    database: "testdb"
    sslmode: "disable"
  readDB:
    host: "postgres-replica"
    port: 5432
    user: "pguser"
    password: "pgpwd"
    database: "testdb"
    sslmode: "disable"

kafka:
  brokers:
    - "kafka:9092"
  topic: "etl.jobs" 

server:
  bindAddress: "0.0.0.0"
  port: 8000
  resourseTimeout: 120
  analyticsTimeout: 500

log:
  level: "info"   # info | debug | trace
  toFile: true    # keep the required logs.log and err_logs.log files
